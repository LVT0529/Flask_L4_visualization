<script>
$(document).ready(function() {
    $("ul.list-unstyled.components li").click(function() {
      // 기존에 활성화된 항목의 클래스 제거
      $("ul.list-unstyled.components li.active").removeClass("active");

      // 클릭한 항목에 활성화 클래스 추가
      $(this).addClass("active");
    });
  });
</script>
