{% extends 'base.html' %}
{% block content %}
<!-- index.html -->



<!DOCTYPE html>
<html>
  <head>
    <title>AfreecaTV L4 Management</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue-router@3.5.2/dist/vue-router.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.2.0/mdb.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vuedraggable@2.24.3/dist/vuedraggable.min.js"></script>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" />
    <style>
        #loadingOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            z-index: 1000;
            text-align: center;
            padding-top: 200px;
            font-size: 24px;
            color: #000;
        }
    </style>
  </head>
  <body>

    <div class="wrapper d-flex align-items-stretch">
      {% include 'sidebar.html' %}

      <div class="treeview-animated w-20 border mx-4 my-4" style="padding: 20px 20px 20px 20px">
        <h4>GSLB 데이터 동기화</h4> <br>


        <button id="myButton">Data_refresh</button>
        <div id="loading" class="loading-wrap" style="display: none;">
             <div class="loading-spinner"></div>
        </div>




        <br>
        <br>

        <h6>한번만 클릭 부탁드립니다.</h6>
        <h6>작업 성공 시 자동으로 메인화면 리다이렉트</h6>
      </div>
      <!-- 대기 페이지 -->
      <div id="loadingOverlay">
          Loading, please wait...
      </div>

      <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
      <script>
          $(document).ready(function() {
              $('#myButton').click(function() {
                  // 대기 페이지 표시
                  $('#loadingOverlay').show();

                  // 사용자에게 알림 표시
                  alert('작업 완료까지 약 1분 소요 예정');

                  // 백그라운드 작업 수행
                  $.ajax({
                      url: '/visual/visual/run_function',  // Flask 라우트 URL
                      type: 'GET',
                      success: function(response) {
                          // 작업 완료 시 대기 페이지 숨김
                          $('#loadingOverlay').hide();
                          alert('데이터 갱신 성공');
                          // 메인화면으로 리다이렉트
                          window.location.href = '/visual/visual';
                      },
                      error: function(xhr, status, error) {
                          // 작업 실패 시 대기 페이지 숨김
                          $('#loadingOverlay').hide();
                          alert('작업 실패 (네트워크팀 케이에게 문의)');
                      }
                  });
              });
          });
      </script>


    
  </body>
</html>

{% endblock %}
